[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# After the API is live on Render, set API_PROXY_TARGET in Netlify env
# and uncomment the proxy redirect below (place ABOVE the SPA rule).
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API.onrender.com/api/:splat"
#   status = 200
#   force = true