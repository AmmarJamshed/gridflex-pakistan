# Optional Render Blueprint — deploy backend as a free web service
services:
  - type: web
    name: gridflex-pakistan-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./gridflex.db
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true