services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gridflex
      POSTGRES_PASSWORD: gridflex
      POSTGRES_DB: gridflex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Supabase-compatible DDL lives in database/schema.sql (apply separately).
    # Runtime tables are created by SQLAlchemy on backend startup.

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://gridflex:gridflex@db:5432/gridflex
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: